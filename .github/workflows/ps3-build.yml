name: PS3 Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    container:
      image: hugoabbad/psl1ght
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y python3 python3-pip python3-pil libpng-dev zlib1g-dev gcc g++ make

      - name: Build PS3
        run: |
          chmod +x build_ps3.sh
          ./build_ps3.sh
        env:
          PS3DEV: /usr/local/ps3dev
          PSL1GHT: /usr/local/ps3dev/ppu

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance2-PS3
          path: "*.pkg"
          if-no-files-found: warn
